# Production-like stack: MongoDB + Express API + Next.js web.
#   cp .env.example .env   (set JWT_SECRET)
#   docker compose up --build
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/voyagr}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}
      # Plain-http local stack: Secure cookies would be rejected by some browsers.
      # Set to "true" when serving over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "5000:5000"

  web:
    build:
      context: .
      target: web
      args:
        # Baked into the client bundle; must be reachable from the browser.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  mongo-data:
