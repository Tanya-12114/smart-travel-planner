# Hot-reload development stack. Use together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  api:
    build:
      target: dev
    command: npx nodemon server/index.js
    environment:
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:-dev_only_secret_change_me}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

  web:
    build:
      target: dev
    command: npx next dev -p 3000 -H 0.0.0.0
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
